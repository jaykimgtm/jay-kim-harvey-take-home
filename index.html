<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0F0E0D">
  <title>Hiring the first Japan GTM team · Jay Kim</title>
  <meta name="description" content="Take-home exercise review for Harvey Tokyo: intake, sourcing and outreach for the first Japan go-to-market hires.">
  <link rel="preload" href="fonts/source-serif-4.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/geist.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles.css?v=10">
  <!--
    Access gate: a door, not a vault (the repo is public, so the page source is readable by anyone who looks).
    Only SHA-256("jay-kim-harvey-take-home:" + code) lives here, never the code. To change the code, put the new
    digest in this meta tag (recipe in README.md). The boot script below sets data-gate before first paint.
  -->
  <meta name="gate-digest" content="06ed3f16dd035db2b1cabec13378b603ae20d500277765a17dc924a43e811d98">
  <script>
    (function () {
      var d = document.documentElement;
      var want = document.querySelector('meta[name="gate-digest"]').content;
      var open = false;
      try { open = localStorage.getItem("jk-harvey-take-home-gate") === want; } catch (e) {}
      d.setAttribute("data-gate", open ? "open" : "locked");
    })();
  </script>
</head>
<body data-tone="dusk">
  <!-- Painted ground: abstract dusk landscape in CSS, one layer per tone, cross-faded as slides change. -->
  <div class="ground" aria-hidden="true">
    <div class="ground__layer" data-tone="dusk"></div>
    <div class="ground__layer" data-tone="smoke"></div>
    <div class="ground__layer" data-tone="moss"></div>
    <div class="ground__layer" data-tone="ochre"></div>
    <div class="ground__layer" data-tone="slate"></div>
    <div class="ground__grain"></div>
    <div class="ground__vignette"></div>
  </div>

  <div class="gate" id="gate" role="dialog" aria-modal="true" aria-labelledby="gate-title">
    <form class="gate__panel" id="gate-form" autocomplete="off" novalidate>
      <p class="gate__brand">Harvey</p>
      <h1 class="gate__title" id="gate-title">Take-home review</h1>
      <p class="gate__sub">Jay Kim · Tokyo GTM &amp; G&amp;A</p>
      <label class="gate__label" for="gate-code">Access code</label>
      <div class="gate__row">
        <input class="gate__input" id="gate-code" name="code" type="password" inputmode="numeric" autocomplete="off" spellcheck="false" required>
        <button class="gate__btn" type="submit">Open</button>
      </div>
      <p class="gate__error" id="gate-error" role="alert" aria-live="assertive"></p>
      <noscript><p class="gate__error">This review needs JavaScript to open.</p></noscript>
    </form>
  </div>

  <header class="bar">
    <a class="bar__brand" href="#1" aria-label="Back to the first slide">Harvey</a>
    <p class="bar__meta"><span>Tokyo GTM &amp; G&amp;A</span><span class="bar__dot" aria-hidden="true"></span><span>Take-home review</span></p>
    <div class="bar__progress" aria-hidden="true"><i></i></div>
  </header>

  <main class="deck" id="deck" aria-live="polite"></main>

  <nav class="tabs" aria-label="Slides">
    <div class="tabs__track" role="tablist" aria-label="Jump to a slide">
      <span class="tabs__ink" aria-hidden="true"></span>
    </div>
    <div class="tabs__ctrl">
      <span class="tabs__count" aria-live="polite"></span>
      <button class="ctl" type="button" data-step="-1" aria-label="Previous slide">←</button>
      <button class="ctl" type="button" data-step="1" aria-label="Next slide">→</button>
    </div>
  </nav>

  <aside class="notes-panel" id="notes" aria-label="Speaker notes" aria-hidden="true">
    <p class="notes-panel__label">Speaker notes</p>
    <p class="notes-panel__body"></p>
  </aside>

  <p class="keys" aria-hidden="true"><kbd>←</kbd><kbd>→</kbd> move <span>·</span> <kbd>1</kbd>–<kbd>9</kbd> jump <span>·</span> <kbd>N</kbd> notes <span>·</span> <kbd>F</kbd> full screen</p>

  <script src="app.js?v=10" defer></script>
</body>
</html>
